<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>返り点でみる漢文 — 回帰テスト</title>
<style>
  body { font-family: "Yu Gothic", "Meiryo", sans-serif; margin: 1.5em; background: #faf7f0; color: #322; }
  h1 { font-size: 1.2em; }
  #summary { font-size: 1.1em; font-weight: bold; margin: 0.8em 0; }
  #summary.pass { color: #1a7a2e; }
  #summary.fail { color: #b3231c; }
  ul { list-style: none; padding: 0; }
  li { padding: 0.15em 0.4em; border-bottom: 1px solid #e6ddcc; font-size: 0.9em; }
  li.ok::before { content: "✅ "; }
  li.ng::before { content: "❌ "; }
  li.ng { background: #fde8e6; }
  .version { color: #998; font-size: 0.8em; }

  /* スマホでは操作領域を確保し、本文枠の中だけで横スクロールする。 */
  @media screen and (max-width: 700px) {
    header { flex-wrap: wrap; }
    header > * { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    header .brand { font-size: 14px; }
    #toolbar { font-size: 14px; }
    #toolbar > label { display: flex; flex-wrap: wrap; align-items: center; gap: .3em; min-width: 0; max-width: 100%; }
    #toolbar select { min-width: 0; max-width: 100%; }
    button, select, input:not([type="checkbox"]):not([type="radio"]) { min-width: 40px; min-height: 40px; }
    button { max-width: 100%; overflow-wrap: anywhere; white-space: normal; }
    main, aside { min-width: 0; max-width: 100%; }
    footer { font-size: 14px; overflow-wrap: anywhere; }
    footer a { display: inline-flex; align-items: center; min-width: 40px; min-height: 40px; max-width: 100%; vertical-align: middle; }

    body { margin: 1rem; }
    h1, #summary, #list li { overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<h1>返り点でみる漢文 — 回帰テスト <span class="version">v121</span></h1>
<div id="summary">実行中…</div>
<ul id="list"></ul>
<script src="kanbun.js?v=121"></script>
<script src="progress.js?v=121"></script>
<script src="punct-check.js?v=121"></script>
<script src="reference.js?v=121"></script>
<script src="gojun.js?v=121"></script>
<script src="kuho.js?v=121"></script>
<script src="print.js?v=121"></script>
<script src="hataraki.js?v=121"></script>
<script src="chobun-check.js?v=121"></script>
<script src="chobun.js?v=121"></script>
<script src="michi.js?v=121"></script>
<script src="tests.js?v=121"></script>
<script>
// test.html 自身の携帯幅検査では、親と同じテストを再帰的に起動しない。
if (new URLSearchParams(location.search).get('mobile-layout') === '1') {
  document.getElementById('summary').textContent = '375px表示の検査中（回帰テストは親画面で実行）';
  document.documentElement.dataset.mobileLayoutReady = 'true';
} else {
Promise.all(['texts.json?v=121', 'reference.json?v=121', 'kuho.json?v=121', '../qa/questions.json', 'imi.json?v=121', 'hataraki.json?v=121', 'chobun.json?v=121', 'ichiji.json?v=121', 'jisho.json?v=121'].map(url =>
  fetch(url).then(r => { if (!r.ok) throw new Error(url + ': ' + r.status); return r.json(); })
))
  .then(async ([texts, pages, kuho, qa, imi, hataraki, chobun, ichiji, dictionary]) => {
    const data = {pages, kuho, qa, imi, hataraki, chobun, ichiji, dictionary};
    const rs = window.KanbunTests.run(texts.problems, data)
      .concat(await window.KanbunTests.runBrowser(texts.problems, data));
    const fails = rs.filter(r => !r.ok);
    const sum = document.getElementById('summary');
    sum.textContent = rs.length + ' 件中 ' + (rs.length - fails.length) + ' 件合格 / ' + fails.length + ' 件失敗';
    sum.className = fails.length ? 'fail' : 'pass';
    const ul = document.getElementById('list');
    for (const r of rs){
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'ng';
      li.textContent = r.name + (r.ok ? '' : ' — ' + r.msg);
      ul.appendChild(li);
    }
  })
  .catch(e => {
    const sum = document.getElementById('summary');
    sum.className = 'fail';
    sum.textContent = 'texts.json の読み込みに失敗: ' + e;
  });
}
</script>
</body>
</html>
