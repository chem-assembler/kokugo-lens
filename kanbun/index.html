<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>返り点でみる漢文 | 国語レンズ</title>
<style>
  :root {
    --ink: #322a20;
    --paper: #faf6ec;
    --panel: #fffdf6;
    --frame: #d8cdb4;
    --accent: #b3410e;   /* 訓点の朱 */
    --badge: #1e6b5e;    /* 読み順バッジ */
    --ok: #1a7a2e;
    --ng: #b3231c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
  }
  header {
    display: flex; align-items: baseline; gap: 0.8em;
    padding: 0.6em 1em; background: #2e2618; color: #f5efdf;
  }
  header h1 { font-size: 1.15em; margin: 0; }
  header .brand { font-size: 0.75em; color: #cfc4a6; }
  header .version { margin-left: auto; font-size: 0.7em; color: #a89c7c; }
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center;
    padding: 0.6em 1em; border-bottom: 1px solid var(--frame); background: var(--panel);
    font-family: "Yu Gothic", "Meiryo", sans-serif; font-size: 0.85em;
  }
  #problem-select { font-size: 1em; max-width: 20em; padding: 0.2em; }
  button {
    font-family: inherit; font-size: 1em; padding: 0.3em 0.9em;
    border: 1px solid var(--frame); border-radius: 0.4em;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover { background: #f3ecdb; }
  button.primary { background: #2e5d47; color: #fff; border-color: #2e5d47; }
  button.primary:hover { background: #38735a; }
  button.toggled { background: #e9dfc8; }

  main { display: flex; gap: 1em; padding: 1em; align-items: flex-start; flex-wrap: wrap; }

  /* ---- 縦書きエリア（右=白文、左=書き下し） ---- */
  #stage {
    writing-mode: vertical-rl;
    background: var(--panel); border: 1px solid var(--frame); border-radius: 0.5em;
    padding: 1.2em 1.5em; min-height: 24em; max-height: 34em;
    flex: 1 1 24em; display: flex; gap: 1.6em;
    /* vertical-rl では column が「右→左の横並び」。白文が右・書き下しが左になる */
    flex-direction: column;
  }
  #sentence { font-size: 1.1em; }
  .cell {
    position: relative; display: inline-block;
    width: 3.6em; height: 2.5em; cursor: pointer; border-radius: 0.3em;
  }
  .cell:hover { background: #f3ecdb; }
  .cell.selected { outline: 2px solid #2e5d47; background: #eef3e9; }
  .cell.diverge { background: #fde0dd; outline: 2px solid var(--ng); }
  .cell .kanji {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    font-size: 1.6em; line-height: 1.5;
  }
  .cell .yomi {
    position: absolute; left: calc(50% + 0.85em); top: 0.1em;
    writing-mode: vertical-rl; font-size: 0.5em; color: #776a52;
  }
  .cell .okuri {
    position: absolute; left: calc(50% + 0.85em); top: 1.7em;
    writing-mode: vertical-rl; font-size: 0.55em;
  }
  .cell .kunten {
    position: absolute; left: 0.15em; top: 1.6em;
    writing-mode: vertical-rl; font-size: 0.6em; color: var(--accent); font-weight: bold;
  }
  .cell .order-badge {
    position: absolute; left: 0.1em; top: 0.1em;
    writing-mode: horizontal-tb;
    font-size: 0.5em; font-family: "Yu Gothic", sans-serif;
    background: var(--badge); color: #fff; border-radius: 0.8em;
    padding: 0.05em 0.45em; min-width: 1.2em; text-align: center;
  }
  #kudashi-col {
    font-size: 1.0em; color: #40382a; max-width: 8em;
    border-right: 1px dotted var(--frame); padding-right: 0.8em;
  }
  #kudashi-col .label { font-size: 0.65em; color: #998a6a; }
  #kudashi-live { margin-top: 0.6em; line-height: 1.6; }
  #kudashi-note { font-size: 0.6em; color: #a08; color: #997; margin-top: 0.5em; }

  /* ---- 操作パネル ---- */
  #side {
    flex: 1 1 18em; max-width: 26em;
    font-family: "Yu Gothic", "Meiryo", sans-serif; font-size: 0.9em;
  }
  #palette {
    background: var(--panel); border: 1px solid var(--frame); border-radius: 0.5em;
    padding: 0.7em;
  }
  #palette .hint { font-size: 0.8em; color: #877a5e; margin-bottom: 0.5em; }
  #palette .keys { display: flex; flex-wrap: wrap; gap: 0.35em; }
  #palette button {
    font-family: "Yu Mincho", serif; font-size: 1.2em; width: 2.2em; height: 2.2em;
    padding: 0; color: var(--accent); font-weight: bold;
  }
  #palette button.erase { font-size: 0.75em; width: auto; padding: 0 0.8em; color: var(--ink); font-weight: normal; }
  #palette button:disabled { opacity: 0.35; cursor: default; }
  #result {
    margin-top: 0.8em; padding: 0.8em; border-radius: 0.5em; display: none;
    line-height: 1.5;
  }
  #result.ok { display: block; background: #e7f3e4; border: 1px solid var(--ok); }
  #result.wrong { display: block; background: #fde8e6; border: 1px solid var(--ng); }
  #meta { margin-top: 0.8em; font-size: 0.85em; color: #6b5f48; line-height: 1.6; }
  footer { padding: 0.8em 1em 1.5em; font-size: 0.75em; color: #998a6a;
           font-family: "Yu Gothic", sans-serif; }
  footer a { color: #6b5f48; }
  @media (max-width: 700px) {
    main { flex-direction: column; }
    #stage { max-height: none; width: 100%; }
    #side { max-width: none; }
  }
</style>
</head>
<body>
<header>
  <h1>返り点でみる漢文</h1>
  <span class="brand">国語レンズ｜KokugoLenz</span>
  <span class="version">v1</span>
</header>

<div id="toolbar">
  <label>問題:
    <select id="problem-select"></select>
  </label>
  <button id="btn-grade" class="primary">判定する</button>
  <button id="btn-reset">リセット</button>
  <button id="btn-answer">正解を見る</button>
  <button id="btn-yomi">読み仮名</button>
</div>

<main>
  <div id="stage">
    <div id="sentence"></div>
    <div id="kudashi-col">
      <span class="label">書き下し（あなたの訓点から自動生成）</span>
      <div id="kudashi-live"></div>
      <div id="kudashi-note"></div>
    </div>
  </div>
  <div id="side">
    <div id="palette">
      <div class="hint">字をタップして、打つ訓点を選んでください（もう一度押すと消えます）</div>
      <div class="keys">
        <button data-mark="re">レ</button>
        <button data-mark="1-1">一</button>
        <button data-mark="1-2">二</button>
        <button data-mark="1-3">三</button>
        <button data-mark="2-1">上</button>
        <button data-mark="2-2">中</button>
        <button data-mark="2-3">下</button>
        <button class="erase" data-mark="erase">消す</button>
      </div>
    </div>
    <div id="result"></div>
    <div id="meta"></div>
  </div>
</main>

<footer>
  国語レンズ（KokugoLenz）｜<a href="../">レンズ一覧</a>｜<a href="test.html">回帰テスト</a>
</footer>

<script src="kanbun.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
