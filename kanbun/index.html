<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>返り点でみる漢文 | 国語レンズ</title>
<style>
  :root {
    --ink: #322a20;
    --paper: #faf6ec;
    --panel: #fffdf6;
    --frame: #d8cdb4;
    --accent: #b3410e;   /* 訓点の朱 */
    --badge: #1e6b5e;    /* 読み順バッジ */
    --ok: #1a7a2e;
    --ng: #b3231c;
    --trace: #c99700;    /* 再生アニメの現在位置 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
  }
  header {
    display: flex; align-items: baseline; gap: 0.8em;
    padding: 0.6em 1em; background: #2e2618; color: #f5efdf;
  }
  header h1 { font-size: 1.15em; margin: 0; }
  header .brand { font-size: 0.75em; color: #cfc4a6; }
  header .version { margin-left: auto; font-size: 0.7em; color: #a89c7c; }
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center;
    padding: 0.6em 1em; border-bottom: 1px solid var(--frame); background: var(--panel);
    font-family: "Yu Gothic", "Meiryo", sans-serif; font-size: 0.85em;
  }
  #problem-select { font-size: 1em; max-width: 18em; padding: 0.2em; }
  #mode-select { font-size: 1em; padding: 0.2em; }
  button {
    font-family: inherit; font-size: 1em; padding: 0.3em 0.9em;
    border: 1px solid var(--frame); border-radius: 0.4em;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover { background: #f3ecdb; }
  button.primary { background: #2e5d47; color: #fff; border-color: #2e5d47; }
  button.primary:hover { background: #38735a; }
  button.toggled { background: #e9dfc8; }
  button:disabled { opacity: 0.4; cursor: default; }

  /* ---- 学習履歴の帯 ---- */
  #progress-bar {
    display: flex; align-items: center; gap: 0.7em; flex-wrap: wrap;
    padding: 0.4em 1em; background: #f4eedd; border-bottom: 1px solid var(--frame);
    font-family: "Yu Gothic", "Meiryo", sans-serif; font-size: 0.78em; color: #6b5f48;
  }
  #progress-bar .done { color: var(--ok); font-weight: bold; }
  button.tiny {
    font-size: 0.9em; padding: 0.1em 0.6em; border-radius: 0.3em;
    color: #8a7d63; background: transparent; border: 1px solid var(--frame);
  }

  main { display: flex; gap: 1em; padding: 1em; align-items: flex-start; flex-wrap: wrap; }

  /* ---- 縦書きエリア（右=白文、左=書き下し） ---- */
  #stage {
    position: relative;
    writing-mode: vertical-rl;
    background: var(--panel); border: 1px solid var(--frame); border-radius: 0.5em;
    padding: 1.2em 1.5em; min-height: 24em; max-height: 34em;
    flex: 1 1 24em; display: flex; gap: 1.6em;
    /* vertical-rl では column が「右→左の横並び」。白文が右・書き下しが左になる */
    flex-direction: column;
  }
  #arrow-layer {
    position: absolute; inset: 0; pointer-events: none;
    writing-mode: horizontal-tb;
  }
  #sentence { font-size: 1.1em; }
  .cell {
    position: relative; display: inline-block;
    width: 3.6em; height: 2.5em; cursor: pointer; border-radius: 0.3em;
  }
  .cell:hover { background: #f3ecdb; }
  .cell.selected { outline: 2px solid #2e5d47; background: #eef3e9; }
  .cell.diverge { background: #fde0dd; outline: 2px solid var(--ng); }
  .cell.flash { background: #fde0dd; outline: 2px solid var(--ng); }
  .cell.tracing { background: #fff3c4; outline: 2px solid var(--trace); }
  .cell .kanji {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    font-size: 1.6em; line-height: 1.5;
  }
  .cell .yomi {
    position: absolute; left: calc(50% + 0.85em); top: 0.1em;
    writing-mode: vertical-rl; font-size: 0.5em; color: #776a52;
  }
  .cell .okuri {
    position: absolute; left: calc(50% + 0.85em); top: 1.7em;
    writing-mode: vertical-rl; font-size: 0.55em;
  }
  .cell .kunten {
    position: absolute; left: 0.15em; top: 1.6em;
    writing-mode: vertical-rl; font-size: 0.6em; color: var(--accent); font-weight: bold;
  }
  .cell .kunten.blank {
    color: #fff; background: var(--accent); border-radius: 0.3em;
    padding: 0.1em 0.15em; font-weight: bold;
  }
  /* 熟語返り（連読符）。字と字の境をまたぐ短い縦棒。返り点と同じ左の余白に置く */
  .cell .joiner {
    position: absolute; left: 0.32em; top: 2.1em;
    width: 0.14em; height: 0.8em; border-radius: 0.07em;
    background: var(--accent);
  }
  .cell .order-badge {
    position: absolute; left: 0.1em; top: 0.1em;
    writing-mode: horizontal-tb;
    font-size: 0.5em; font-family: "Yu Gothic", sans-serif;
    background: var(--badge); color: #fff; border-radius: 0.8em;
    padding: 0.05em 0.45em; min-width: 1.2em; text-align: center;
  }
  #kudashi-col {
    font-size: 1.0em; color: #40382a; max-width: 8em;
    border-right: 1px dotted var(--frame); padding-right: 0.8em;
  }
  #kudashi-col .label { font-size: 0.65em; color: #998a6a; }
  #kudashi-live { margin-top: 0.6em; line-height: 1.6; }
  #kudashi-note { font-size: 0.6em; color: #997; margin-top: 0.5em; }

  /* ---- 操作パネル ---- */
  #side {
    flex: 1 1 18em; max-width: 26em;
    font-family: "Yu Gothic", "Meiryo", sans-serif; font-size: 0.9em;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--frame); border-radius: 0.5em;
    padding: 0.7em;
  }
  .panel .hint { font-size: 0.8em; color: #877a5e; margin-bottom: 0.5em; }
  #palette .keys { display: flex; flex-wrap: wrap; gap: 0.35em; }
  #palette .keys button {
    font-family: "Yu Mincho", serif; font-size: 1.2em; width: 2.2em; height: 2.2em;
    padding: 0; color: var(--accent); font-weight: bold;
  }
  #palette .keys button.erase { font-size: 0.75em; width: auto; padding: 0 0.8em; color: var(--ink); font-weight: normal; }
  #choices { display: none; }
  #choices .keys { display: flex; flex-wrap: wrap; gap: 0.35em; }
  #choices .keys button {
    font-family: "Yu Mincho", serif; font-size: 1.1em; min-width: 2.4em; height: 2.2em;
    padding: 0 0.5em; color: var(--accent); font-weight: bold;
  }
  /* L4 の送り仮名選び */
  #okuri-panel { display: none; margin-top: 0.6em; }
  #okuri-panel .keys { display: flex; flex-wrap: wrap; gap: 0.35em; }
  #okuri-panel .keys button {
    font-family: "Yu Mincho", serif; font-size: 1.1em; min-width: 3em; height: 2.2em;
    padding: 0 0.6em;
  }
  #okuri-panel .keys button.chosen {
    background: #eef3e9; border-color: #2e5d47; font-weight: bold;
  }
  /* 送り仮名が伏せてある字。押すと候補が出る */
  .cell .okuri.ask {
    border: 1px dashed var(--accent); border-radius: 0.3em;
    padding: 0.05em 0.1em; cursor: pointer; color: var(--accent);
  }
  .cell .okuri.ask.filled { border-style: solid; color: var(--ink); background: #eef3e9; }
  #result {
    margin-top: 0.8em; padding: 0.8em; border-radius: 0.5em; display: none;
    line-height: 1.5;
  }
  #result.ok { display: block; background: #e7f3e4; border: 1px solid var(--ok); }
  #result.wrong { display: block; background: #fde8e6; border: 1px solid var(--ng); }
  #result.info { display: block; background: #f3ecdb; border: 1px solid var(--frame); }
  #replay-bar { margin-top: 0.6em; display: flex; gap: 0.5em; flex-wrap: wrap; }
  #meta { margin-top: 0.8em; font-size: 0.85em; color: #6b5f48; line-height: 1.6; }
  #meta .note { color: #8a6a3a; font-size: 0.92em; }
  footer { padding: 0.8em 1em 1.5em; font-size: 0.75em; color: #998a6a;
           font-family: "Yu Gothic", sans-serif; }
  footer a { color: #6b5f48; }
  @media (max-width: 700px) {
    main { flex-direction: column; }
    #stage { max-height: none; width: 100%; }
    #side { max-width: none; }
  }

  /* ======================================================================
     録画モード（?rec= のときだけ付く .recording / rec-* クラス）
     通常利用ではここは一切当たらない。設計は chem 側 DESIGN_recording_mode.md
     ====================================================================== */

  /* 映したくないものを消して、白文・訓点・書き下しを主役にする。
     #toolbar は label（問題・モードのセレクト）だけ隠してボタンは残す。
     全部隠すと #btn-grade の矩形がゼロになり、ゴーストカーソルが左上へ飛ぶ */
  .recording header,
  .recording footer,
  .recording #progress-bar,
  .recording #toolbar label { display: none !important; }
  .recording #toolbar { border-bottom: none; background: transparent; padding: 0.3em 1em; }
  /* 台本が押すのは判定だけ。ほかのボタンは画に映って気が散るので隠す。
     #btn-grade だけは残す（隠すと矩形がゼロになり、ゴーストカーソルが左上へ飛ぶ）。
     読み仮名は kanbunApp.setShowYomi が直に click() するので、隠れていても効く */
  .recording #btn-reset,
  .recording #btn-answer,
  .recording #btn-yomi,
  .recording #btn-next-unclear,
  .recording #replay-bar { display: none !important; }

  #rec-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 3000; }
  #rec-cursor {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    border-radius: 50%; transform: translate(-50%, -50%);
    background: rgba(179, 65, 14, 0.3); border: 2px solid var(--accent);
    box-shadow: 0 0 14px rgba(179, 65, 14, 0.7); z-index: 3002;
  }
  #rec-cursor.touch { width: 34px; height: 34px; }
  .rec-no-cursor #rec-cursor { display: none; }

  #rec-caption {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: calc(100% - 40px); max-width: 680px; padding: 0.7em 1em;
    border-radius: 10px; background: rgba(46, 38, 24, 0.94); color: #f5efdf;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    font-size: 0.95em; line-height: 1.6; text-align: left; z-index: 3003;
  }
  #rec-caption.empty { display: none; }
  .rec-no-caption #rec-caption { display: none; }

  /* 縦型（9:16・810×1440）。ブレークポイントが 700px なので自動では当たらない。
     横並びのままだと下に 800px 前後の余白が残るので、ここで1列に畳む */
  .rec-short main { flex-direction: column; padding: 0.8em; }
  .rec-short #side { max-width: none; }
  /* 1列にしただけでは、紙の左9割と下 800px が白いまま残る（v53 の実収録で確認）。
     縦書きの列は右端から始まるので、紙を縦に使って列を中央へ寄せる。
     vertical-rl の flex は主軸が左右・交差軸が上下なので、
     justify-content が左右・align-items が上下の中央寄せになる */
  .rec-short #stage {
    max-height: none; width: 100%; min-height: 60em;
    justify-content: center; align-items: center;
  }
  /* 810×1440 で撮って 1080×1920 に伸ばし、手のひらで見る。字はこの倍率が要る */
  .rec-short #sentence { font-size: 2.2em; }
  .rec-short #kudashi-col { font-size: 1.6em; max-width: 9em; }
  /* 「書き下し（あなたの読み方から自動生成）」というラベルと、まだ何も読んでいない
     ときの操作案内は、どちらも縦に長く伸びて**見せたい書き下しそのものと張り合う**。
     字幕が同じことを言うので落とす（game.js が .placeholder を付ける） */
  .rec-short #kudashi-col .label,
  .recording #kudashi-live.placeholder { display: none; }
  .rec-short #result { font-size: 1.25em; }
  .rec-short #meta { font-size: 1.05em; }
  /* 34px の丸は 88px のセルの上では字を塗りつぶしてしまう。輪だけ見せる */
  .rec-short #rec-cursor { width: 48px; height: 48px; background: rgba(179, 65, 14, 0.1); }
  /* 音無しで見られる前提。字幕は大きく中央に */
  /* 下から 14%。8% だと2つとぶつかる:
     (1) mux.mjs が焼き込むクレジットが h*0.885（＝下から11.5%）に来る
     (2) Instagram や TikTok のプレイヤーは下部をUIで覆う
     どちらも実物で確かめた（v57 の完成 mp4 で字幕とクレジットが重なっていた） */
  .rec-short #rec-caption {
    bottom: 14%; max-width: none; width: calc(100% - 32px);
    padding: 0.8em 1em; border-radius: 14px; font-size: 1.5em;
    font-weight: 700; line-height: 1.45; text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>返り点でみる漢文</h1>
  <span class="brand">国語レンズ｜KokugoLenz</span>
  <span class="version">v58</span>
</header>

<div id="toolbar">
  <label>問題:
    <select id="problem-select"></select>
  </label>
  <label>モード:
    <select id="mode-select">
      <option value="L1">L1 読む順にタップ</option>
      <option value="L2">L2 訓点を1つ選ぶ</option>
      <option value="L3">L3 訓点を打つ</option>
      <option value="L4">L4 訓点＋送り仮名</option>
      <option value="L6">L6 書き下しから訓点を復元（逆問題）</option>
    </select>
  </label>
  <button id="btn-grade" class="primary">判定する</button>
  <button id="btn-reset">リセット</button>
  <button id="btn-answer">正解を見る</button>
  <button id="btn-yomi">読み仮名</button>
  <button id="btn-next-unclear">次の未クリアへ</button>
</div>

<div id="progress-bar">
  <span id="progress-text"></span>
  <button id="btn-progress-reset" class="tiny">記録を消す</button>
</div>

<main>
  <div id="stage">
    <svg id="arrow-layer">
      <defs>
        <marker id="ah-wrong" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L7,4 L0,8 z" fill="#b3231c"></path>
        </marker>
        <marker id="ah-correct" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L7,4 L0,8 z" fill="#b3410e"></path>
        </marker>
      </defs>
      <g id="arrow-g"></g>
    </svg>
    <div id="sentence"></div>
    <div id="kudashi-col">
      <span class="label">書き下し（あなたの読み方から自動生成）</span>
      <div id="kudashi-live"></div>
      <div id="kudashi-note"></div>
    </div>
  </div>
  <div id="side">
    <div id="palette" class="panel">
      <div class="hint" id="mode-hint"></div>
      <div class="keys">
        <button data-mark="re">レ</button>
        <button data-mark="1-1">一</button>
        <button data-mark="1-2">二</button>
        <button data-mark="1-3">三</button>
        <button data-mark="2-1">上</button>
        <button data-mark="2-2">中</button>
        <button data-mark="2-3">下</button>
        <button class="erase" data-mark="erase">消す</button>
      </div>
    </div>
    <div id="choices" class="panel">
      <div class="hint">「？」の位置に入る訓点はどれ？</div>
      <div class="keys"></div>
    </div>
    <!-- L4 の送り仮名選び。字を選ぶと、その字に入る送り仮名の候補が出る -->
    <div id="okuri-panel" class="panel">
      <div class="hint" id="okuri-hint"></div>
      <div class="keys"></div>
    </div>
    <div id="result"></div>
    <div id="replay-bar">
      <button id="btn-replay" disabled>自分の読み順を再生</button>
      <button id="btn-replay-correct" disabled>正しい読み順を再生</button>
    </div>
    <div id="meta"></div>
  </div>
</main>

<footer>
  国語レンズ（KokugoLenz）｜<a href="guide.html">志望校から選ぶ</a>｜<a href="kudashi.html">書き下し練習</a>｜<a href="kuho.html">句法クイズ</a>｜<a href="../qa/">一問一答</a>｜<a href="../">レンズ一覧</a>｜<a href="test.html">回帰テスト</a>
</footer>

<script src="kanbun.js?v=58"></script>
<script src="progress.js?v=58"></script>
<script src="game.js?v=58"></script>
<!-- 録画モード。?rec= が無ければ即 return する（game.js の後に読む） -->
<script src="rec.js?v=58"></script>
</body>
