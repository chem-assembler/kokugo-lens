<!DOCTYPE html>

<head>

<title>国語レンズ | KokugoLenz</title>
<style>
  body {
    margin: 0; background: #faf6ec; color: #322a20;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
  }
  header { padding: 2em 1.5em 1em; }
  h1 { font-size: 1.6em; margin: 0; font-family: "Yu Mincho", serif; }
  .sub { color: #877a5e; font-size: 0.85em; margin-top: 0.4em; }
  main { padding: 1em 1.5em 3em; max-width: 40em; }
  .app-card {
    display: block; background: #fffdf6; border: 1px solid #d8cdb4;
    border-radius: 0.6em; padding: 1em 1.2em; text-decoration: none;
    color: inherit; margin-top: 1em;
  }
  .app-card:hover { background: #f3ecdb; }
  .app-card .name { font-size: 1.15em; font-family: "Yu Mincho", serif; }
  .app-card .desc { font-size: 0.85em; color: #6b5f48; margin-top: 0.3em; line-height: 1.5; }

<body>
<header>
  <h1>国語レンズ</h1>
  <div class="sub">KokugoLenz — レンズを通すと、国語が見える。SchoolLenz の教科ブランド</div>
</header>
<main>
  <a class="app-card" href="kanbun/">
    <div class="name">返り点でみる漢文</div>
    <div class="desc">白文に返り点を打つと、書き下し文がその場で生まれる。
      採点は訓点の表記ではなく「読み順」で行うので、レ点でも一二点でも、正しく読めていれば正解。<br>
      訓点モード（3段階）・書き下し練習（カード並べ替え）・句法クイズ。</div>
  </a>
  <a class="app-card" href="qa/">
    <div class="name">一問一答（漢文）</div>
    <div class="desc">訓点の名称・置き字・再読文字・頻出語・出典を、
      暗記モード（めくり）と測定モード（複数選択）の二面で。知識の土台をここで固める。</div>
  </a>
</main>
<footer>国語レンズ（KokugoLenz）｜SchoolLenz ファミリー</footer>
