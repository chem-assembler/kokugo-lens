<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一問一答 — 国語レンズ | Schoollenz</title>
<meta name="description" content="知識と正誤を1対1で対応させる漢文の一問一答。訓点・置き字・再読文字・頻出語・出典を、暗記モード（めくり）と測定モード（複数選択）の二面構成で。無料・広告なし・ログイン不要。">
<!-- qa (一問一答・漢文)  v3  Lv4（難関）を10項目追加して全5単元に行き渡らせた -->
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../" aria-label="国語レンズ ハブへ戻る">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ハブ
    </a>
    <div class="brand"><b>一問一答</b><span class="dom">漢文</span></div>
    <span class="version">v3</span>
  </div>
</div>

<div class="wrap">
  <!-- 「来た道」の帯（アプリ横断の戻り道）。`?code=<自分のコード>&from=<アプリ>` で
       戻ってきたときだけ出る。ビューの外に置くのは、どの画面に着地しても見えるようにするため -->
  <div id="back-band" class="back-band hidden"></div>

  <!-- ホーム -->
  <section id="view-home" class="view">
    <p class="lede">知識と正誤を1対1で。<b>暗記モード</b>で毎日想起し、<b>測定モード</b>（複数選択）で到達度をたしかめる。</p>
    <button class="btn ghost go-map" id="btn-map">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      習得マップ（単元 × 難易度）
    </button>
    <div id="unit-list"></div>
  </section>

  <!-- 習得マップ -->
  <section id="view-map" class="view hidden">
    <div class="study-head">
      <button class="quit" id="btn-map-back">← 単元にもどる</button>
    </div>
    <div id="map-host"></div>
  </section>

  <!-- 演習 -->
  <section id="view-study" class="view hidden">
    <div class="study-head">
      <span class="q-of" id="q-of">1 / 10</span>
      <div class="pbar"><span id="pbar-fill" style="width:0%"></span></div>
      <button class="quit" id="btn-quit">やめる</button>
    </div>
    <div id="card-host"></div>
  </section>

  <!-- 結果 -->
  <section id="view-result" class="view hidden">
    <div class="result">
      <h2 id="result-title">おつかれさま</h2>
      <p class="sub" id="result-sub"></p>
      <div class="score">
        <div class="s ok"><b id="score-ok">0</b><span id="score-ok-label">わかった</span></div>
        <div class="s ng"><b id="score-ng">0</b><span id="score-ng-label">あやしい</span></div>
      </div>
      <div class="r-actions">
        <button class="btn primary" id="btn-again">もう一度</button>
        <button class="btn ghost" id="btn-home">単元にもどる</button>
      </div>
    </div>
  </section>
</div>

<div class="wrap"><footer>Schoollenz ／ 国語レンズ — 一問一答　·　<a href="../kanbun/" style="color:inherit">返り点でみる漢文</a></footer></div>

<script src="app.js?v=3"></script>
</body>
</html>
