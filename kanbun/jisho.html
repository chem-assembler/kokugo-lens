<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重要漢字の辞書｜国語レンズ</title>
<link rel="stylesheet" href="dictionary.css?v=120">
<style>
  :root { --ink: #322a20; --paper: #faf6ec; --panel: #fffdf6; --frame: #d8cdb4; --pick: #2e5d47; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Yu Gothic", "Meiryo", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.8em; padding: 0.8em 1em; background: #2e2618; color: #f5efdf; }
  h1 { font-family: "Yu Mincho", serif; font-size: 1.2em; margin: 0; }
  header .brand { font-size: 0.75em; color: #cfc4a6; }
  header .version { margin-left: auto; font-size: 0.7em; color: #a89c7c; }
  main { max-width: 78em; margin: auto; padding: 1em; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: 1em; align-items: start; }
  .panel { padding: 1em; border: 1px solid var(--frame); background: var(--panel); border-radius: 0.5em; min-width: 0; }
  .filters { display: grid; gap: 0.7em; }
  label { display: grid; gap: 0.3em; font-size: 0.9em; }
  input, select, button { font: inherit; color: inherit; }
  input, select { padding: 0.6em; width: 100%; min-width: 0; background: #fff; border: 1px solid var(--frame); border-radius: 0.3em; }
  button { border: 1px solid var(--frame); border-radius: 0.3em; background: #fff; cursor: pointer; }
  button:hover { background: #f3ecdb; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
  #reset { padding: 0.5em 0.8em; justify-self: start; }
  #result-count, .hint { color: #6b5f48; font-size: 0.85em; line-height: 1.7; }
  #character-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.8em, 1fr)); gap: 0.35em; max-height: 32em; overflow-y: auto; padding: 0.3em; }
  #character-grid button { min-height: 2.8rem; font: 1.5em "Yu Mincho", serif; }
  #character-grid button[aria-pressed="true"] { color: #fff; background: var(--pick); border-color: var(--pick); }
  #entry-title { font: 2.8em "Yu Mincho", serif; margin: 0; }
  #entry-content .dictionary-entry { margin-top: 0.5em; }
  #entry-content:focus { outline: none; }
  footer { padding: 1em; font-size: 0.8em; color: #6b5f48; text-align: center; line-height: 1.9; }
  footer a { color: #6b5f48; }
  @media (max-width: 700px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 0.6em; }
    #character-grid { max-height: 20em; }
    .panel { padding: 0.8em; }
  }

  /* スマホでは操作領域を確保し、本文枠の中だけで横スクロールする。 */
  @media screen and (max-width: 700px) {
    header { flex-wrap: wrap; }
    header > * { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    header .brand { font-size: 14px; }
    #toolbar { font-size: 14px; }
    #toolbar > label { display: flex; flex-wrap: wrap; align-items: center; gap: .3em; min-width: 0; max-width: 100%; }
    #toolbar select { min-width: 0; max-width: 100%; }
    button, select, input:not([type="checkbox"]):not([type="radio"]) { min-width: 40px; min-height: 40px; }
    button { max-width: 100%; overflow-wrap: anywhere; white-space: normal; }
    main, aside { min-width: 0; max-width: 100%; }
    footer { font-size: 14px; overflow-wrap: anywhere; }
    footer a { display: inline-flex; align-items: center; min-width: 40px; min-height: 40px; max-width: 100%; vertical-align: middle; }

    #result-count, .hint { font-size: 14px; }
  }
</style>
</head>
<body data-jisho>
<header><h1>重要漢字の辞書</h1><span class="brand">国語レンズ</span><span class="version">v120</span></header>
<main>
  <section class="panel" aria-label="漢字を選ぶ">
    <div class="filters">
      <label for="role-filter">働きで絞り込む<select id="role-filter"><option value="">すべての働き</option></select></label>
      <label for="reading-search">読み・漢字で検索<input id="reading-search" type="search" placeholder="例：いはく、まさに、曰" autocomplete="off"></label>
      <button id="reset" type="button">絞り込みを解除</button>
    </div>
    <p class="hint">問題に多く出る順の150字です。字を選ぶと、読み・意味と用例が開きます。働きは用例での代表的な働きです。</p>
    <p id="result-count" role="status">読み込み中…</p>
    <div id="character-grid" aria-label="重要漢字の一覧"></div>
  </section>
  <article id="entry-content" class="panel" tabindex="-1" aria-label="選んだ字の説明"><p>問題データと辞書を読み込んでいます。</p></article>
</main>
<footer>
  <div>読みは歴史的仮名づかいで表記しています。用例は収録した問題の白文と書き下しです。</div>
  国語レンズ（KokugoLenz）｜<a href="index.html">訓点モード</a>｜<a href="present.html">提示モード（先生用）</a>｜<a href="reference.html">漢文の参考書</a>｜<a href="../">レンズ一覧</a>
</footer>
<script src="present.js?v=120"></script>
<script src="jisho-page.js?v=120"></script>
</body>
</html>
