<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜国語レンズ</title>
<style>
  :root{--bg:#f5f7f8;--fg:#18222a;--muted:#5a6972;--accent:#0c7a8a;--card:#fff;--line:#dde4e7}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1519;--fg:#e8eef0;--muted:#98a7ad;--accent:#4cc3d3;--card:#162026;--line:#24323a}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.8 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;max-width:420px;width:100%;text-align:center}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{margin:0 0 20px;color:var(--muted)}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 22px}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:16px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>このページは見つかりませんでした。</h1>
    <p>トップから探してみよう。</p>
    <a class="btn" href="/">国語レンズ のトップへ</a>
  </div>
</main>
<footer>Schoollenz ／ 国語レンズ　·　© 2026 Schoollenz</footer>
</body>
</html>
